# Local dev only: Redis plus the Next.js dev server with the source mounted.
# Run from showup/:  docker compose -f docker-compose.dev.yml up
# Needs .env.local (copy .env.example and add the LiveKit key/secret).
services:
  redis:
    image: redis:7-alpine
    container_name: showup-redis
    ports:
      - "6380:6379"

  app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3012"
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3012:3012"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - redis
