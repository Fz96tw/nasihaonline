# Lets `sops <file>` (edit-in-place) auto-pick the right age recipient and
# format for the real plaintext secret files. The backup/restore scripts in
# scripts/secrets-*.sh pass --age/--input-type/--output-type explicitly
# instead of relying on this, since they operate on tmpdir paths that don't
# match these regexes — this file is mainly for ad hoc manual use.
#
# Decrypting anywhere requires the matching age PRIVATE key at
# ~/.config/sops/age/keys.txt (or $SOPS_AGE_KEY_FILE) — back that up
# separately (e.g. a password manager), it is not and must never be in git.
creation_rules:
  - path_regex: ^homelab/\.env$
    input_type: dotenv
    output_type: dotenv
    age: age1zfd3eunhmqa227s03kurkcf954g6trpu94qsvsyuul6l8q0meu7sycgw2v
  - path_regex: ^vps/\.env$
    input_type: dotenv
    output_type: dotenv
    age: age1zfd3eunhmqa227s03kurkcf954g6trpu94qsvsyuul6l8q0meu7sycgw2v
  - path_regex: ^vps/(livekit|egress)\.yaml$
    input_type: yaml
    output_type: yaml
    age: age1zfd3eunhmqa227s03kurkcf954g6trpu94qsvsyuul6l8q0meu7sycgw2v
